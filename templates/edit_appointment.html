<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modifica Appuntamento</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 20px;
    }
    .calendar-day {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      background-color: #f0f0f0;
      cursor: pointer;
      font-weight: bold;
    }
    .calendar-day.disabled {
      background-color: #ddd;
      color: #aaa;
      cursor: not-allowed;
    }
    .calendar-day.selected {
      background-color: #007bff;
      color: white;
    }
    .time-slot {
      padding: 10px;
      margin: 5px;
      background-color: #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
    }
    .time-slot.disabled {
      background-color: #ccc;
      color: #999;
      cursor: not-allowed;
    }
    .time-slot.selected {
      background-color: #28a745;
      color: white;
    }
    .times-container {
      display: flex;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Modifica Appuntamento</h2>

    <form method="post">
      <input type="hidden" name="date" id="selected-date" value="{{ appointment[2] }}" required>
      <input type="hidden" name="time" id="selected-time" value="{{ appointment[3] }}" required>

      <label for="service">Servizio:</label>
      <select name="service" required>
        <option value="Taglio di capelli" {% if appointment[1] == 'Taglio di capelli' %} selected {% endif %}>Taglio di capelli</option>
        <option value="Taglio di capelli + Barba" {% if appointment[1] == 'Taglio di capelli + Barba' %} selected {% endif %}>Taglio di capelli + Barba</option>
        <option value="Solo Barba" {% if appointment[1] == 'Solo Barba' %} selected {% endif %}>Solo Barba</option>
      </select>

      <h3>Seleziona una Data</h3>
      <div id="calendar" class="calendar"></div>

      <h3>Orari Disponibili</h3>
      <div id="times" class="times-container"></div>

      <button type="submit">Aggiorna</button>
    </form>

    <a href="{{ url_for('user_dashboard') }}">Annulla</a>
  </div>

  <script>
    const calendar = document.getElementById('calendar');
    const timesContainer = document.getElementById('times');
    const dateInput = document.getElementById('selected-date');
    const timeInput = document.getElementById('selected-time');

    const today = new Date();
    const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
    const year = today.getFullYear();
    const month = today.getMonth();

    const dayNames = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];

    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(year, month, d);
      const weekday = date.getDay();
      const dateStr = date.toISOString().split('T')[0];

      const div = document.createElement('div');
      div.classList.add('calendar-day');
      div.innerText = `${d}\n${dayNames[weekday]}`;

      if (date < today || weekday === 0 || weekday === 1) {
        div.classList.add('disabled');
      } else {
        div.addEventListener('click', () => {
          document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
          dateInput.value = dateStr;
          loadTimes(date);
        });

        if (dateStr === dateInput.value) {
          div.classList.add('selected');
        }
      }

      calendar.appendChild(div);
    }

    const times = ['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00'];

    function loadTimes(date) {
      timesContainer.innerHTML = '';
      const isSaturday = date.getDay() === 6;
      const dateStr = date.toISOString().split('T')[0];

      fetch('{{ url_for("get_booked_times") }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: dateStr })
      })
      .then(res => res.json())
      .then(data => {
        const booked = data.booked_times;

        times.forEach(t => {
          const isAfter15 = isSaturday && t > '15:00';
          const isDisabled = booked.includes(t) || isAfter15;

          const div = document.createElement('div');
          div.classList.add('time-slot');
          if (isDisabled) div.classList.add('disabled');
          div.innerText = t;

          if (!isDisabled) {
            div.addEventListener('click', () => {
              document.querySelectorAll('.time-slot').forEach(el => el.classList.remove('selected'));
              div.classList.add('selected');
              timeInput.value = t;
            });

            if (t === timeInput.value) {
              div.classList.add('selected');
            }
          }

          timesContainer.appendChild(div);
        });
      });
    }

    // Carica gli orari al primo caricamento (data già precompilata)
    loadTimes(new Date(dateInput.value));
  </script>
</body>
</html>
