<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Utenti</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fdf6ee;
      font-family: sans-serif;
    }

    .page {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1400px;
      margin: 40px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    }

    .top-link {
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    table th, table td {
      padding: 8px 10px;
      text-align: left;
      border: 1px solid #ccc;
    }

    table th {
      background-color: #e8d8c3;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .big-btn, .delete-btn {
      width: 100%;
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
    }

    .big-btn {
      background-color: #a6794e;
    }

    .delete-btn {
      background-color: #000 !important;
    }

    .delete-btn:hover {
      background-color: #333 !important;
    }

    .big-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="container">
      <a class="top-link" href="{{ url_for('admin_dashboard') }}">&larr; Torna alla Dashboard</a>

      <h2>Utenti Registrati</h2>

      {% if users %}
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Telefono</th>
            <th>Email</th>
            <th>Username</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
          <tr>
            <td>{{ user[0] }}</td>
            <td>{{ user[1] }}</td>
            <td>{{ user[2] }}</td>
            <td>{{ user[3] }}</td>
            <td>{{ user[4] or 'ND' }}</td>
            <td>{{ user[5] }}</td>
            <td>
              <div class="actions">
                <a href="{{ url_for('admin_edit_user', user_id=user[0]) }}" title="Modifica">
                  <button class="big-btn">Modifica</button>
                </a>
                <form method="post" action="{{ url_for('delete_user', user_id=user[0]) }}">
                  <button type="submit" class="delete-btn" onclick="return confirm('Confermi eliminazione utente?')">Elimina</button>
                </form>
              </div>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
        <p>Nessun utente registrato.</p>
      {% endif %}

    </div>
  </div>
</body>
</html>
