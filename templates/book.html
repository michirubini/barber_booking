<!DOCTYPE html>
<html lang="it">
<head>
    <title>Book an Appointment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Prenota un Appuntamento</h2>

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        <form method="post">
            <label for="service">Seleziona Servizio:</label>
            <select name="service" required>
                <option value="Taglio di capelli">Taglio di capelli</option>
                <option value="Taglio di capelli + Barba">Taglio di capelli + Barba</option>
                <option value="Solo Barba">Solo Barba</option>
            </select>

            <label for="date">Seleziona Data:</label>
            <input type="date" name="date" id="date" required>

            <label for="time">Seleziona Orario:</label>
            <select name="time" id="time" required>
                <option value="09:00">09:00</option>
                <option value="09:30">09:30</option>
                <option value="10:00">10:00</option>
                <option value="10:30">10:30</option>
                <option value="11:00">11:00</option>
                <option value="11:30">11:30</option>
                <option value="12:00">12:00</option>
                <option value="12:30">12:30</option>
                <option value="13:00">13:00</option>
                <option value="13:30">13:30</option>
                <option value="14:00">14:00</option>
                <option value="14:30">14:30</option>
                <option value="15:00">15:00</option>
                <option value="15:30">15:30</option>
                <option value="16:00">16:00</option>
                <option value="16:30">16:30</option>
                <option value="17:00">17:00</option>
                <option value="17:30">17:30</option>
                <option value="18:00">18:00</option>
                <option value="18:30">18:30</option>
                <option value="19:00">19:00</option>
            </select>

            <button type="submit">Prenota</button>
        </form>

        <a href="{{ url_for('index') }}">Torna alla Home</a>
    </div>

    <!-- JS per disabilitare orari già occupati e quelli oltre le 15:00 il sabato -->
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const dateInput = document.getElementById('date');
        const timeSelect = document.getElementById('time');

        function updateTimes(date) {
            if (!date) return;

            const selectedDay = new Date(date).getDay(); // 6 = sabato
            const isSaturday = selectedDay === 6;

            fetch('{{ url_for("get_booked_times") }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date: date })
            })
            .then(response => response.json())
            .then(data => {
                const booked = data.booked_times;

                Array.from(timeSelect.options).forEach(option => {
                    const time = option.value;
                    const isAfter15 = time > '15:00';

                    if (booked.includes(time) || (isSaturday && isAfter15)) {
                        option.disabled = true;
                        option.style.backgroundColor = '#ccc';
                    } else {
                        option.disabled = false;
                        option.style.backgroundColor = '';
                    }
                });
            });
        }

        dateInput.addEventListener('change', function () {
            updateTimes(this.value);
        });
    });
    </script>
</body>
</html>
